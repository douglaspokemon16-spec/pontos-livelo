<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parabéns · Bradesco Livelo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #C62828 0%, #8B0000 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .card-branco {
            background: white;
            border-radius: 32px;
            padding: 40px 30px;
            box-shadow: 0 30px 50px rgba(0,0,0,0.3);
            text-align: center;
        }

        .logos {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
        }

        .logos img {
            max-height: 60px;
            width: auto;
            object-fit: contain;
        }

        .titulo {
            color: #C62828;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .pontos-box {
            background: #f5f5f5;
            padding: 25px;
            border-radius: 20px;
            margin: 25px 0;
        }

        .pontos-label {
            font-size: 1.1rem;
            color: #666;
        }

        .pontos-valor {
            font-size: 3rem;
            font-weight: 800;
            color: #C62828;
            margin: 10px 0;
        }

        .pontos-texto {
            font-size: 1.2rem;
            color: #333;
        }

        .mensagem {
            color: #333;
            font-size: 1.2rem;
            line-height: 1.6;
            margin: 25px 0;
        }

        .notificacao {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 15px;
            border-radius: 50px;
            font-weight: 600;
            margin: 25px 0;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #C62828;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 25px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-voltar {
            background: #C62828;
            color: white;
            border: none;
            padding: 16px 30px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 40px;
            cursor: pointer;
            margin-top: 20px;
            text-decoration: none;
            display: inline-block;
            transition: 0.2s;
        }

        .btn-voltar:hover {
            background: #8B0000;
            transform: scale(1.05);
        }

        .footer {
            margin-top: 20px;
            color: rgba(255,255,255,0.7);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card-branco">
            <div class="logos">
                <img src="logobradesco.png" alt="Bradesco">
                <img src="logolivelo.png" alt="Livelo">
            </div>
            
            <div class="titulo">Parabéns! 🎉</div>
            
            <div class="pontos-box">
                <div class="pontos-label">Você resgatou</div>
                <div class="pontos-valor" id="pontos">98.570</div>
                <div class="pontos-texto">pontos Livelo</div>
            </div>
            
            <div class="mensagem">
                Aguarde a conclusão do procedimento.<br>
                Você será notificado em breve.
            </div>
            
            <div class="notificacao" id="notificacao">
                🔔 Notificação será enviada por e-mail e SMS
            </div>
            
            <div class="loader"></div>
            
            <a href="/" class="btn-voltar">Voltar ao início</a>
        </div>
        
        <div class="footer">
            Bradesco · Livelo · Resgate de Pontos
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        document.getElementById('pontos').textContent = params.get('pontos') || '98.570';
        document.getElementById('notificacao').innerHTML = `🔔 Notificação será enviada por ${params.get('notificacao') || 'e-mail e SMS'}`;
        setTimeout(() => window.location.href = '/', 10000);
    </script>
</body>
</html>
