<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bradesco · Livelo · Resgate</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #C62828 0%, #8B0000 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .card-branco {
            background: white;
            border-radius: 32px;
            padding: 40px 30px;
            box-shadow: 0 30px 50px rgba(0,0,0,0.3);
            text-align: center;
        }

        .logos {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
        }

        .logos img {
            max-height: 60px;
            width: auto;
            object-fit: contain;
        }

        .titulo {
            color: #C62828;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .pontos {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 20px;
            margin: 25px 0;
        }

        .pontos .valor {
            font-size: 2.5rem;
            font-weight: 800;
            color: #C62828;
        }

        .mensagem {
            color: #333;
            font-size: 1.2rem;
            line-height: 1.6;
            margin: 20px 0;
        }

        .notificacao {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 15px;
            border-radius: 50px;
            font-weight: 600;
            margin: 20px 0;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #C62828;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-home {
            background: #C62828;
            color: white;
            border: none;
            padding: 16px 30px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 40px;
            cursor: pointer;
            margin-top: 20px;
            text-decoration: none;
            display: inline-block;
        }

        .btn-home:hover {
            background: #8B0000;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card-branco">
            <div class="logos">
                <img src="logobradesco.png" alt="Bradesco">
                <img src="logolivelo.png" alt="Livelo">
            </div>
            
            <div class="titulo">Parabéns!</div>
            
            <div class="pontos">
                <div>Você resgatou</div>
                <div class="valor" id="pontosResgatados">98.570</div>
                <div>pontos Livelo</div>
            </div>
            
            <div class="mensagem">
                Aguarde a conclusão do procedimento.<br>
                Você será notificado em breve.
            </div>
            
            <div class="notificacao">
                🔔 Notificação será enviada por e-mail e SMS
            </div>
            
            <div class="loader"></div>
            
            <a href="/" class="btn-home">Voltar ao início</a>
        </div>
    </div>

    <script>
        // Pega os pontos da URL ou localStorage
        const urlParams = new URLSearchParams(window.location.search);
        let pontos = urlParams.get('pontos') || localStorage.getItem('ultimosPontos') || '98.570';
        
        document.getElementById('pontosResgatados').textContent = pontos;
        
        // Redireciona após 10 segundos (opcional)
        setTimeout(() => {
            window.location.href = '/';
        }, 10000);
    </script>
</body>
</html>
